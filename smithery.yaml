name: mcp-property-valuation-server
description: "基于 MCP 的房产估值服务，提供小区评级、小区估值和单户估值能力。"

runtime: typescript
target: local

readme: "./README.md"

startCommand:
  type: stdio
  commandFunction: |
    (config) => {
      return {
        command: "node",
        args: ["index.cjs"],
        env: {
          'MCP-INDUSTRY-APPID': config.APPID
        }
      };
    }

configSchema:
  type: object
  required:
    - APPID
  properties:
    APPID:
      type: string
      title: "Industry APPID"
      description: "CREIS 行业系统下发的行业 APPID，用于鉴权调用估值接口"

exampleConfig:
  APPID: "plCRRjDq3xRQeiovL9WjFYsicfttVXU2KGRcHneF2oM="

capabilities:
  tools:
    - name: get_community_rating
      title: "Get Community Rating"
      description: "获取小区评级信息"
    - name: get_community_valuation
      title: "Get Community Valuation"
      description: "获取小区基础估值"
    - name: get_property_valuation
      title: "Get Property Valuation"
      description: "获取单户房产估值"
