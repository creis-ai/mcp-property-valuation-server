# ==========================================
# MCP Server 配置文件（Smithery.ai）
# 适用于仅 STDIO 启动的 Node.js 服务
# ==========================================

runtime: typescript # 虽然你最终运行 JS，但可以声明 TS /源码方式
target: local # 本地 / stdio 方式

# 启动方式：使用 Node.js 通过 STDIO 启动 MCP Server
startCommand:
  type: stdio
  commandFunction: |
    (config) => {
      return {
        command: "node",
        args: ["index.js"],   // 你的 JS 入口文件
        env: {
          // 把用户在 Smithery 填写的 APPID 注入到进程中
          MCP_INDUSTRY_APPID: config.APPID
        }
      }
    }

# MCP 服务配置项定义（让使用者在 Smithery 填写）
configSchema:
  type: object
  required:
    - APPID
  properties:
    APPID:
      type: string
      title: "Industry APPID"
      description: "CREIS Industry AppID，用于鉴权调用房产估值接口"

# config 示例（Smithery UI 中展示）
exampleConfig:
  APPID: "your-appid-here"

# 指定 README，让 Smithery 在 Market 页面显示你的 README 内容
readme: "./README.md"

# 定义你的能力 (tools)，Smithery 能识别你的 API 功能
capabilities:
  tools:
    - name: get_community_rating
      title: "Get Community Rating"
      description: "获取小区评级信息"
    - name: get_community_valuation
      title: "Get Community Valuation"
      description: "获取小区基础估值"
    - name: get_property_valuation
      title: "Get Property Valuation"
      description: "获取单户房产估值"
